name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Python client smoke
        run: python clients/tests/test_python_client.py
      - name: Live server end-to-end
        run: python clients/tests/test_live_server.py
      - name: C++ client smoke
        shell: bash
        run: |
          if command -v clang++ >/dev/null 2>&1; then
            CXX=clang++
          elif command -v g++ >/dev/null 2>&1; then
            CXX=g++
          else
            echo "No C++ compiler available; skipping smoke test"
            exit 0
          fi
          "$CXX" -std=c++17 -Wall -Wextra -Werror clients/tests/cpp_client_smoke.cpp -o cpp_client_smoke
          ./cpp_client_smoke
