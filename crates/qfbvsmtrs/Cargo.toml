[package]
name = "qfbvsmtrs"
version = "0.1.0"
edition = "2021"
description = "Standalone pure-Rust QF_BV SMT solver via bit-blasting"
license = "MIT OR Apache-2.0"

[features]
default = []
wire = ["dep:smt-wire"]

[dependencies]
smt-qfbv-smtlib = { path = "../smt-qfbv-smtlib" }
smt-wire = { path = "../smt-wire", optional = true }
varisat = "0.2.2"
splr = "0.17.2"

[dev-dependencies]
z3 = { version = "0.20.0", features = ["gh-release"] }
