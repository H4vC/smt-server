[package]
name = "smt-server"
version = "0.1.0"
edition = "2021"
description = "Reference SMT wire-format server and backends"
license = "MIT OR Apache-2.0"

[dependencies]
binbit = { git = "https://github.com/bint-disasm/binbit", rev = "b4996145c06f39ce5bbc79a959975d7d20b6cf5e" }
qfbvsmtrs = { path = "../qfbvsmtrs", features = ["wire"] }
smt-qfbv-smtlib = { path = "../smt-qfbv-smtlib" }
smt-wire = { path = "../smt-wire" }
z3 = { version = "0.20.0", features = ["gh-release"] }
